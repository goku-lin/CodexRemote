name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-public-candidate
          path: |
            .relay-data/releases/CodexRemote-Setup-*.exe
            .relay-data/releases/connector-*.zip
            .relay-data/releases/candidate-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
