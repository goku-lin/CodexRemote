name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching package.json, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne ('v' + $version)) { throw 'Tag must match package.json version' }
      - run: npm ci
      - run: npm test
      - name: Build with persistent release signing key
        shell: pwsh
        env:
          CODEX_REMOTE_RELEASE_SIGNING_KEY: ${{ secrets.CODEX_REMOTE_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:CODEX_REMOTE_RELEASE_SIGNING_KEY) { throw 'Configure the release signing secret before publishing' }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $files = @(Get-ChildItem .relay-data/releases/CodexRemote-Setup-*.exe, .relay-data/releases/connector-*.zip, .relay-data/releases/update-manifest.json | ForEach-Object { $_.FullName })
          if ($files.Count -ne 3) { throw 'Expected EXE, ZIP and signed update manifest' }
          gh release create $env:RELEASE_TAG @files --target $env:GITHUB_SHA --title $env:RELEASE_TAG --draft --prerelease --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
